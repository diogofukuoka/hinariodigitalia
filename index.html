<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hinário Digital com IA</title>
  
  <!-- 1. CONFIGURAÇÃO DA IMPORTAÇÃO DA IA (IMPORT MAP) -->
  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>

  <style>
    body { 
        background-color: #f4f4f9; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        color: #333; 
        margin: 0; 
        padding: 0; 
    }
    .container { 
        max-width: 800px; 
        margin: 20px auto; 
        background-color: #ffffff; 
        border-radius: 12px; 
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        padding: 20px 40px;
        transition: max-width 0.3s ease, border-radius 0.3s ease, padding 0.3s ease;
    }
    .container.container-full-width {
        max-width: 100%;
        min-height: 100vh; 
        margin: 0;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
    }
    h1, h2 { 
        text-align: center; 
        color: #2c3e50; 
        margin-bottom: 30px; 
        font-weight: 600; 
    }
    .versiculo-subtitulo {
        text-align: center; font-style: italic; font-size: 0.95em;
        color: #555; margin-top: -20px; margin-bottom: 30px;
    }
    #caixaDeBusca, #caixaDeTemaIA, #inputApiKey { 
        width: 100%; padding: 15px; margin-bottom: 15px; 
        font-size: 1.1em; border: 1px solid #ddd; border-radius: 8px; 
        box-sizing: border-box; 
    }
    #caixaDeBusca:focus, #caixaDeTemaIA:focus, #inputApiKey:focus { 
        border-color: #2980b9; box-shadow: 0 0 8px rgba(41, 128, 185, 0.2); 
        outline: none; 
    }
    #listaDeHinos { list-style-type: none; padding: 0; }
    #listaDeHinos li { margin-bottom: 12px; }
    #listaDeHinos a { 
        display: block; padding: 16px 20px; background-color: #f9f9f9; 
        color: #34495e; text-decoration: none; border-radius: 8px; 
        border: 1px solid #e1e1e1; font-size: 1.1em; 
        transition: all 0.2s ease-in-out; cursor: pointer;
    }
    #listaDeHinos a:hover, #listaDeHinos a:focus { 
        background-color: #e8f4f8; color: #2980b9; 
        transform: translateY(-2px) scale(1.01); 
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-color: #bde0fe; 
    }
    .conteudo-hino { 
        position: relative; 
        display: none; 
        padding: 20px 40px;
        text-align: center;
    }
    .conteudo-hino .titulo-hino { font-size: 1.8em; font-weight: 600; color: #2c3e50; }
    .conteudo-hino .autor-hino { font-size: 1.2em; color: #555; margin-bottom: 25px; font-style: italic; }
    .conteudo-hino pre {
        font-family: 'Georgia', 'serif'; font-size: 1.5em; line-height: 1.6;
        white-space: pre-wrap; word-wrap: break-word; text-align: left;
    }
    #secao-solicitados {
        margin-bottom: 30px; padding: 20px; border: 1px solid #e1e1e1;
        border-radius: 12px; background-color: #f8f9fa;
    }
    #lista-historico .item-historico,
    #lista-favoritos .item-historico,
    #resultadoIA .item-historico {
        padding: 16px 20px; background-color: #fff; color: #34495e;
        border-radius: 8px; border: 1px solid #e1e1e1; font-size: 1.1em;
        margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease-in-out;
    }
    #lista-historico .item-historico:hover,
    #lista-favoritos .item-historico:hover,
    #resultadoIA .item-historico:hover {
        background-color: #e8f4f8; color: #2980b9;
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-color: #bde0fe; 
    }
    #botao-limpar-historico {
        display: block; margin: 20px auto 0; font-weight: bold; padding: 10px 20px;
        cursor: pointer; background-color: #e74c3c; color: white; border: none;
        border-radius: 8px; font-size: 0.9em; transition: background-color 0.2s;
    }
    #botao-limpar-historico:hover { background-color: #c0392b; }
    #top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px; 
        background-color: #f8f9fa;
        border-bottom: 1px solid #ddd;
        position: sticky; top: 0; z-index: 10;
    }
    .botoes-navegacao, #zoom-controls { display: flex; gap: 10px; }
    .botao-navegacao, .zoom-button {
        font-weight: bold; padding: 10px 15px; cursor: pointer;
        color: white; border: none; border-radius: 8px; font-size: 0.9em; 
        transition: background-color 0.2s;
    }
    .botao-navegacao { background-color: #34495e; }
    .botao-navegacao:hover { background-color: #2c3e50; }
    .zoom-button { background-color: #34495e; }
    .zoom-button:hover { background-color: #2c3e50; }

    .controles-finais-hino { display: flex; justify-content: center; gap: 15px; margin-top: 30px; padding-bottom: 20px;}
    .botao-voltar-hino {
        font-weight: bold; padding: 12px 20px; cursor: pointer; background-color: #34495e;
        color: white; border: none; border-radius: 8px; font-size: 1em; transition: background-color 0.2s;
    }
    .botao-voltar-hino:hover { background-color: #2c3e50; }
    .botao-favorito {
        position: absolute; top: 25px; right: 25px; background: none; border: none;
        font-size: 2em; cursor: pointer; color: #ccc; transition: color 0.2s;
    }
    .botao-favorito.ativo { color: #ffc107; }
    #botao-ver-favoritos, #botao-sugestao-ia {
        display: block; width: 80%; margin: 20px auto; padding: 12px 20px; font-weight: bold;
        cursor: pointer; color: white; border: none; border-radius: 8px; font-size: 1.1em; text-align: center;
    }
    #botao-ver-favoritos { background-color: #3498db; }
    #botao-ver-favoritos:hover { background-color: #2980b9; }
    .botao-voltar-favoritos, .botao-voltar-ia {
        font-weight: bold; padding: 12px 20px; margin-bottom: 20px; cursor: pointer;
        background-color: #34495e; color: white; border: none; border-radius: 8px; font-size: 1em;
    }
    .botao-voltar-favoritos:hover, .botao-voltar-ia:hover { background-color: #2c3e50; }

    #botao-sugestao-ia { background-color: #1abc9c; }
    #botao-sugestao-ia:hover { background-color: #16a085; }
    #botaoBuscarIA, #btnSalvarKey, #btnRemoverKey {
        width: 100%; padding: 12px 20px; font-weight: bold; cursor: pointer; background-color: #1abc9c;
        color: white; border: none; border-radius: 8px; font-size: 1.1em; margin-bottom: 20px;
    }
    #botaoBuscarIA:hover, #btnSalvarKey:hover { background-color: #16a085; }
    #btnRemoverKey { background-color: #e74c3c; margin-top: 10px; }
    #btnRemoverKey:hover { background-color: #c0392b; }

    #resultadoIA {
        border-top: 1px solid #e1e1e1; border-bottom: 1px solid #e1e1e1; 
        padding: 20px 0; min-height: 100px;
        background-color: #ffffff; line-height: 1.6;
    }
    .loading { text-align: center; color: #555; font-style: italic; }

    /* Estilos para a área de configuração da API */
    #config-api-area {
        background-color: #e8f4f8;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #bde0fe;
    }
    .status-key { font-weight: bold; color: #27ae60; display: block; text-align: center; margin-bottom: 10px; }

    @media (max-width: 600px) {
        body { padding: 0; }
        .container { 
            margin: 0;
            border-radius: 0;
            box-shadow: none;
            padding: 15px;
        }
        .conteudo-hino {
            padding: 15px;
        }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div id="secao-solicitados" style="display: none;">
      <h2 style="margin-top:0;">Hinos cantados hoje</h2>
      <div id="lista-historico"></div>
      <button id="botao-limpar-historico">Apagar histórico de hinos cantados</button>
    </div>

    <div id="secao-favoritos" style="display: none;">
      <button class="botao-voltar-favoritos" onclick="mostrarIndice()">← Voltar ao Índice</button>
      <h2 style="margin-top:0;">Hinos Favoritos</h2>
      <div id="lista-favoritos"></div>
    </div>

    <div id="secao-gemini" style="display: none;">
        <button class="botao-voltar-ia" onclick="mostrarIndice()">← Voltar ao Índice</button>
        <h2 style="margin-top: 20px;">Sugestão de Hinos por Assunto</h2>
        
        <!-- ÁREA DE CONFIGURAÇÃO DA CHAVE API -->
        <div id="config-api-area">
            <div id="area-input-key">
                <label for="inputApiKey" style="display:block; margin-bottom:5px; font-weight:bold;">Configurar Chave API (Google Gemini):</label>
                <input type="password" id="inputApiKey" placeholder="Cole sua API Key aqui (ex: AIzaSy...)">
                <button id="btnSalvarKey">Salvar Chave</button>
                <p style="font-size: 0.8em; color: #666;">A chave ficará salva no seu navegador.</p>
            </div>
            <div id="area-key-salva" style="display:none;">
                <span class="status-key">✓ Chave de API configurada e salva!</span>
                <button id="btnRemoverKey">Remover/Alterar Chave</button>
            </div>
        </div>
        <!-- FIM DA ÁREA DE CONFIGURAÇÃO -->

        <input type="text" id="caixaDeTemaIA" placeholder="Ex: Salvação, Amor de Deus, Gratidão...">
        <button id="botaoBuscarIA">Buscar Hinos com IA</button>
        <div id="resultadoIA">
            <p id="loading-ia" class="loading" style="display:none;">Analisando hinos e buscando sugestões... Por favor, aguarde.</p>
        </div>
    </div>

    <div id="top-bar" style="display: none;">
        <div class="botoes-navegacao">
            <button id="btn-voltar-indice-topo" class="botao-navegacao">← Voltar ao Índice</button>
            <button id="btn-voltar-favoritos-topo" class="botao-navegacao">← Voltar aos Favoritos</button>
        </div>
        <div id="zoom-controls">
            <button id="botao-zoom-out" class="zoom-button">-</button>
            <button id="botao-zoom-in" class="zoom-button">+</button>
        </div>
    </div>

    <div id="secao-indice">
        <h1>Hinário Digital</h1>
        <p class="versiculo-subtitulo">"Tudo quanto tem fôlego louve ao SENHOR. Louvai ao SENHOR." (Sl 150:6)</p>
        <button id="botao-ver-favoritos">Ver Hinos Favoritos ⭐</button>
        <button id="botao-sugestao-ia">Sugestão de Hinos por Assunto 🧠</button>
        <input type="text" id="caixaDeBusca" placeholder="Buscar por número, título ou letra...">
        <ul id="listaDeHinos"></ul>
    </div>

    <div id="secao-conteudo"></div>

  </div>

  <!-- 2. SCRIPT PRINCIPAL DO TIPO MODULE -->
  <script type="module">
    // Importa a IA do Google
    import { GoogleGenerativeAI } from "@google/generative-ai";

    document.addEventListener('DOMContentLoaded', () => {
        let tamanhoFonteAtual = 1.5;

        // DADOS DOS HINOS (INSERIDOS DIRETAMENTE PARA FUNCIONAR NO GITHUB PAGES)
        const hinosData = [
            { numero: 1, titulo: "A Divinal Mensagem", autor: "Stuart Edmund Mc Nair", conteudo: `1. A divinal mensagem\nAvisa ao pecador\nQue Deus amou ao mundo\nE deu-lhe um Salvador.\nE quem em Jesus Cristo crer\nEterna bênção há de ter.\n\n2. "Pecado traz a morte",\nAssim Deus declarou,\nE o homem sem desculpa\nPerante Deus ficou.\nMas quem em Jesus Cristo crer\nEterna bênção há de ter.\n\n3. O Pai mandou Seu Filho\nPra vida nos trazer,\nMas Ele não podia\nDar vida sem morrer.\nAgora quem em Cristo crer\nEterna bênção há de ter.\n\n4. Não veio Cristo ao mundo\nA fim de o condenar,\nMas quis, por Sua morte,\nOs homens resgatar.\nE quem em Jesus Cristo crer\nEterna bênção há de ter.` },
            // ... (MANTENHA AQUI A SUA LISTA COMPLETA DE HINOS QUE JÁ ESTAVA NO CÓDIGO) ...
            // Para economizar espaço na resposta, não repeti todos os hinos, 
            // mas você deve manter todos os dados que já tinha aqui.
            { numero: 764, titulo: "Graças damos", autor: "William Anglin", conteudo: `Graças damos-Te, Senhor,\nE nossa adoração,\nPois Tu és digno de louvor\nDe todo o coração.\nAleluia! Aleluia!\nHonra seja a Ti, Jesus!\nAleluia! Aleluia!\nTu morreste sobre a cruz.\nAleluia! Aleluia!\nGlória a Ti! Amém.` }
        ];

        const container = document.querySelector('.container');
        const secoes = {
            indice: document.getElementById('secao-indice'),
            conteudo: document.getElementById('secao-conteudo'),
            historico: document.getElementById('secao-solicitados'),
            favoritos: document.getElementById('secao-favoritos'),
            gemini: document.getElementById('secao-gemini'),
            topBar: document.getElementById('top-bar')
        };
        const listaDeHinos = document.getElementById('listaDeHinos');
        const listaFavoritosContainer = document.getElementById('lista-favoritos');
        const caixaDeBusca = document.getElementById('caixaDeBusca');
        const btnVoltarIndiceTopo = document.getElementById('btn-voltar-indice-topo');
        const btnVoltarFavoritosTopo = document.getElementById('btn-voltar-favoritos-topo');
        const botaoSugestaoIA = document.getElementById('botao-sugestao-ia');
        const botaoBuscarIA = document.getElementById('botaoBuscarIA');
        const caixaDeTemaIA = document.getElementById('caixaDeTemaIA');
        const resultadoIA = document.getElementById('resultadoIA');
        const loadingIA = document.getElementById('loading-ia');

        // Elementos da configuração da API Key
        const inputApiKey = document.getElementById('inputApiKey');
        const btnSalvarKey = document.getElementById('btnSalvarKey');
        const btnRemoverKey = document.getElementById('btnRemoverKey');
        const areaInputKey = document.getElementById('area-input-key');
        const areaKeySalva = document.getElementById('area-key-salva');

        let hinosFavoritos = JSON.parse(localStorage.getItem('hinarioFavoritos')) || [];
        let historicoHinos = JSON.parse(localStorage.getItem('hinarioHistorico')) || [];
        
        // --- LÓGICA DA API KEY ---
        const verificarApiKeySalva = () => {
            const key = localStorage.getItem('geminiApiKey');
            if (key) {
                areaInputKey.style.display = 'none';
                areaKeySalva.style.display = 'block';
                return key;
            } else {
                areaInputKey.style.display = 'block';
                areaKeySalva.style.display = 'none';
                return null;
            }
        };

        const salvarApiKey = () => {
            const key = inputApiKey.value.trim();
            if (key) {
                localStorage.setItem('geminiApiKey', key);
                verificarApiKeySalva();
                alert("Chave salva com sucesso!");
                inputApiKey.value = ''; // Limpa o campo por segurança
            } else {
                alert("Por favor, insira uma chave válida.");
            }
        };

        const removerApiKey = () => {
            if(confirm("Tem certeza que deseja remover a chave salva?")) {
                localStorage.removeItem('geminiApiKey');
                verificarApiKeySalva();
            }
        };

        // Inicializa verificação da chave
        verificarApiKeySalva();

        const esconderTudo = () => Object.values(secoes).forEach(s => s.style.display = 'none');

        window.mostrarIndice = () => {
            container.classList.remove('container-full-width');
            esconderTudo();
            atualizarExibicaoHistorico(); 
            secoes.indice.style.display = 'block';
            caixaDeBusca.value = '';
            filtrarHinos();
            window.scrollTo(0, 0);
        };

        window.mostrarHino = (numero) => {
            container.classList.add('container-full-width');
            adicionarAoHistorico(numero);
            esconderTudo();
            secoes.conteudo.style.display = 'block';
            secoes.topBar.style.display = 'flex';
            document.querySelectorAll('.conteudo-hino').forEach(h => h.style.display = 'none');
            const hinoSelecionado = document.getElementById(`hino-content-${numero}`);
            if (hinoSelecionado) {
                hinoSelecionado.style.display = 'block';
                aplicarZoom();
            }
            atualizarBotaoFavorito(numero);
            window.scrollTo(0, 0);
        };

        window.mostrarFavoritos = () => {
            container.classList.remove('container-full-width');
            esconderTudo();
            secoes.favoritos.style.display = 'block';
            renderizarFavoritos();
            window.scrollTo(0, 0);
        };

        const mostrarSecaoIA = () => {
            container.classList.remove('container-full-width');
            esconderTudo();
            secoes.gemini.style.display = 'block';
            verificarApiKeySalva(); // Verifica estado da chave ao abrir a seção
            caixaDeTemaIA.focus();
        };

        const renderizarListaDeHinos = () => { 
            listaDeHinos.innerHTML = ''; 
            hinosData.sort((a, b) => a.numero - b.numero).forEach(hino => { 
                const a = document.createElement('a'); 
                a.href = "#"; 
                a.textContent = `${hino.numero} - ${hino.titulo}`; 
                a.onclick = (e) => { e.preventDefault(); mostrarHino(hino.numero); }; 
                const li = document.createElement('li'); 
                li.appendChild(a); 
                listaDeHinos.appendChild(li); 
            }); 
        };

        const renderizarConteudosDosHinos = () => { 
            secoes.conteudo.innerHTML = ''; 
            hinosData.forEach(hino => { 
                const divHino = document.createElement('div'); 
                divHino.id = `hino-content-${hino.numero}`; 
                divHino.className = 'conteudo-hino'; 
                divHino.innerHTML = ` 
                    <button class="botao-favorito" id="botao-favorito-${hino.numero}" onclick="toggleFavorito(${hino.numero})">☆</button> 
                    <div class="titulo-hino">${hino.numero} - ${hino.titulo}</div> 
                    <div class="autor-hino">${hino.autor}</div> 
                    <pre>${hino.conteudo}</pre> 
                    <div class="controles-finais-hino"> 
                        <button class="botao-voltar-hino" onclick="mostrarIndice()">← Voltar ao Índice</button> 
                        <button class="botao-voltar-hino" onclick="mostrarFavoritos()">← Voltar aos Favoritos</button> 
                    </div> 
                `; 
                secoes.conteudo.appendChild(divHino); 
            }); 
        };

        const renderizarFavoritos = () => { 
            listaFavoritosContainer.innerHTML = ''; 
            if (hinosFavoritos.length === 0) { 
                listaFavoritosContainer.innerHTML = '<p style="text-align:center; color: #777;">Nenhum hino favorito ainda.</p>'; 
                return; 
            } 
            hinosFavoritos.sort((a, b) => a - b).forEach(num => { 
                const hino = hinosData.find(h => h.numero === num); 
                if (hino) { 
                    const item = document.createElement('div'); 
                    item.className = 'item-historico'; 
                    item.textContent = `${hino.numero} - ${hino.titulo}`; 
                    item.onclick = () => mostrarHino(hino.numero); 
                    listaFavoritosContainer.appendChild(item); 
                } 
            }); 
        };

        const filtrarHinos = () => { 
            const t = caixaDeBusca.value.toLowerCase(), n = /^\d+$/.test(t); 
            Array.from(listaDeHinos.children).forEach(i => { 
                const o = parseInt(i.textContent.split(" - ")[0]), e = hinosData.find(i => i.numero === o); 
                if (e) { 
                    const s = e.titulo.toLowerCase(), a = e.conteudo.toLowerCase(), c = e.numero.toString(); 
                    let d = !1; 
                    (n ? c.includes(t) || s.includes(t) : c.includes(t) || s.includes(t) || a.includes(t)) && (d = !0), i.style.display = d ? "" : "none" 
                } 
            }) 
        };

        const adicionarAoHistorico = (e) => { const o = historicoHinos.indexOf(e); o > -1 && historicoHinos.splice(o, 1), historicoHinos.unshift(e), localStorage.setItem("hinarioHistorico", JSON.stringify(historicoHinos)) };
        const atualizarExibicaoHistorico = () => { const e = document.getElementById("lista-historico"); if (e.innerHTML = "", 0 === historicoHinos.length) return void (secoes.historico.style.display = "none"); secoes.historico.style.display = "block", historicoHinos.forEach(o => { const i = hinosData.find(e => e.numero === o); i && (item = document.createElement("div"), item.className = "item-historico", item.textContent = `${i.numero} - ${i.titulo}`, item.onclick = () => mostrarHino(i.numero), e.appendChild(item)) }) };
        window.toggleFavorito = (e) => { const o = hinosFavoritos.indexOf(e); o > -1 ? hinosFavoritos.splice(o, 1) : hinosFavoritos.push(e), localStorage.setItem("hinarioFavoritos", JSON.stringify(hinosFavoritos)), atualizarBotaoFavorito(e) };
        const atualizarBotaoFavorito = (e) => { const o = document.getElementById(`botao-favorito-${e}`); hinosFavoritos.includes(e) ? (o.classList.add("ativo"), o.textContent = "\u2605") : (o.classList.remove("ativo"), o.textContent = "\u2606") };
        const aplicarZoom = () => { const e = document.querySelector('.conteudo-hino[style*="display: block"]'); e && (e.querySelector("pre").style.fontSize = `${tamanhoFonteAtual}em`) };

        // --- FUNÇÃO DE BUSCA COM IA (CLIENT-SIDE) ---
        const buscarHinosComIA = async () => {
            const tema = caixaDeTemaIA.value.trim();
            if (!tema) {
                resultadoIA.innerHTML = '<p>Por favor, digite um tema para a busca.</p>';
                return;
            }

            // Recupera a chave do localStorage
            const userApiKey = localStorage.getItem('geminiApiKey');

            if (!userApiKey) {
                resultadoIA.innerHTML = '<p style="color:red;">Erro: Chave da API não configurada. Por favor, insira sua chave do Google Gemini acima e clique em Salvar.</p>';
                return;
            }

            resultadoIA.innerHTML = '';
            loadingIA.style.display = 'block';
            resultadoIA.appendChild(loadingIA);
            botaoBuscarIA.disabled = true;

            try {
                // Inicializa a IA com a chave do usuário
                const genAI = new GoogleGenerativeAI(userApiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

                // Prepara os dados para a IA (converte a lista de hinos em texto)
                const hinosTexto = hinosData.map(h => `Hino ${h.numero} - ${h.titulo}\nLetra: ${h.conteudo}`).join('\n---\n');

                const prompt = `
                    Você é um assistente especialista em teologia e hinologia.
                    Sua tarefa é analisar o tema fornecido e selecionar os hinos mais apropriados da lista abaixo.
                    
                    O tema é: "${tema}".

                    Regras:
                    1. Liste no máximo 10 hinos que tenham forte relação com o tema.
                    2. O formato de cada linha deve ser EXATAMENTE: "Hino [número] - [título]".
                    3. Não inclua introdução, conclusão ou explicações. Apenas a lista.

                    Base de hinos:
                    ---
                    ${hinosTexto}
                `;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();

                loadingIA.style.display = 'none';
                botaoBuscarIA.disabled = false;
                resultadoIA.innerHTML = '';

                // Processa a resposta da IA para criar links clicáveis
                const linhas = text.split('\n');
                let encontrouAlgum = false;

                linhas.forEach(linha => {
                    const match = linha.match(/Hino\s+(\d+)/i);
                    if (match) {
                        const numeroHino = parseInt(match[1]);
                        const hino = hinosData.find(h => h.numero === numeroHino);
                        
                        if (hino) {
                            encontrouAlgum = true;
                            const item = document.createElement('div');
                            item.className = 'item-historico';
                            item.textContent = `${hino.numero} - ${hino.titulo}`;
                            item.onclick = () => mostrarHino(hino.numero);
                            resultadoIA.appendChild(item);
                        }
                    }
                });

                if (!encontrouAlgum) {
                    resultadoIA.innerHTML = `<p>A IA respondeu: <br> ${text.replace(/\n/g, '<br>')}</p>`;
                }

            } catch (error) {
                console.error(error);
                loadingIA.style.display = 'none';
                botaoBuscarIA.disabled = false;
                resultadoIA.innerHTML = '<p style="color:red;">Erro ao conectar com a IA. Verifique se sua Chave API está correta e se você tem conexão com a internet.</p>';
            }
        };

        // --- EVENT LISTENERS ---
        caixaDeBusca.addEventListener('keyup', filtrarHinos);
        document.getElementById('botao-limpar-historico').addEventListener('click', () => { historicoHinos = []; localStorage.removeItem('hinarioHistorico'); atualizarExibicaoHistorico(); });
        document.getElementById('botao-ver-favoritos').addEventListener('click', mostrarFavoritos);
        btnVoltarIndiceTopo.addEventListener('click', mostrarIndice);
        btnVoltarFavoritosTopo.addEventListener('click', mostrarFavoritos);
        botaoSugestaoIA.addEventListener('click', mostrarSecaoIA);
        botaoBuscarIA.addEventListener('click', buscarHinosComIA);
        caixaDeTemaIA.addEventListener('keyup', (e) => { if (e.key === 'Enter') buscarHinosComIA(); });
        document.getElementById('botao-zoom-in').addEventListener('click', () => { tamanhoFonteAtual += 0.1; aplicarZoom(); });
        document.getElementById('botao-zoom-out').addEventListener('click', () => { if (tamanhoFonteAtual > 0.6) { tamanhoFonteAtual -= 0.1; aplicarZoom(); } });
        
        // Listeners para configuração da API
        btnSalvarKey.addEventListener('click', salvarApiKey);
        btnRemoverKey.addEventListener('click', removerApiKey);

        // --- INICIALIZAÇÃO ---
        renderizarListaDeHinos();
        renderizarConteudosDosHinos();
        mostrarIndice();
    });
  </script>
</body>
</html>
